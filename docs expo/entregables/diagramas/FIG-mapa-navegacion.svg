<text class="ruta" x="367" y="486">/products/product</text>

<!-- ── ANÁLISIS ───────────────────────────────────────── -->
<rect class="grupo-adm" x="590" y="228" width="240" height="44" rx="4"/>
<text class="tit-adm" x="710" y="248" text-anchor="middle">ANÁLISIS</text>
<text class="ruta" x="710" y="263" text-anchor="middle">solo ADMIN · SUPERVISOR · JEFE_TIENDA</text>
<path class="rama" d="M612 272 L612 325"/>
<path class="rama" d="M612 325 L630 325"/>
