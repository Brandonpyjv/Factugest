<rect class="caja" x="1180" y="355" width="200" height="40" rx="3"/>
<text class="nom" x="1192" y="372">Cerrar sesión</text>
<text class="ruta" x="1192" y="386">/logout</text>

<!-- nota del nivel 3 -->
<text class="etq" x="40" y="682">N3 · detalle: de cada listado se entra a ver, nuevo y editar. Desde una factura se emiten su nota crédito y su nota débito; desde un documento se descargan su PDF y su XML.</text>

<!-- leyenda -->
<rect class="grupo-todos" x="40" y="700" width="20" height="14" rx="2"/>
<text class="lg" x="68" y="712">Visible para los cuatro roles</text>
<rect class="grupo-adm" x="330" y="700" width="20" height="14" rx="2"/>
<text class="lg" x="358" y="712">Solo roles administrativos: se ocultan del menú y además están bloqueados en el servidor</text>
<text class="nota" x="990" y="712">El CAJERO solo ve Inicio, Facturación y Cuenta.</text>
</svg>
