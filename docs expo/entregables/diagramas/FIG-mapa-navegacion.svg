<text class="nom" x="917" y="522">Empresas emisoras</text>
<text class="ruta" x="917" y="536">/branches</text>
<rect class="caja" x="905" y="555" width="200" height="40" rx="3"/>
<text class="nom" x="917" y="572">Usuarios</text>
<text class="ruta" x="917" y="586">/users</text>
