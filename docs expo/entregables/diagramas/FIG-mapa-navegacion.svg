<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="740" viewBox="0 0 1460 740" role="img" aria-label="Mapa de navegacion del panel web de FactuGest: desde Login se entra a Inicio, el tablero de control, y de ahi se abren los cinco grupos del menu lateral — Plataforma, Facturacion, Analisis, Configuracion y Cuenta — con sus destinos. Plataforma, Analisis y Configuracion solo estan disponibles para los roles ADMIN, SUPERVISOR y JEFE_TIENDA.">
<style>
svg{background:#FFFFFF;font-family:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,monospace}
.caja{fill:#FFFFFF;stroke:#AEBFBB;stroke-width:1}
.raiz{fill:#FFFFFF;stroke:#465754;stroke-width:1.6}
.grupo-adm{fill:#D9E1F3;stroke:#2C4478;stroke-width:1.3;stroke-dasharray:6 4}
.grupo-todos{fill:#CFE6DF;stroke:#0B4F44;stroke-width:1.3}
.tit{font-size:13px;font-weight:700;fill:#17201F}
.tit-adm{font-size:12.5px;font-weight:700;fill:#2C4478}
.tit-todos{font-size:12.5px;font-weight:700;fill:#0B4F44}
.nom{font-size:11.5px;font-weight:700;fill:#17201F}
.ruta{font-size:9.5px;fill:#5F6E6B}
.arista{fill:none;stroke:#465754;stroke-width:1.15}
.rama{fill:none;stroke:#8FA5A0;stroke-width:1}
.etq{font-size:9.5px;fill:#5F6E6B}
.nota{font-size:10px;fill:#8C2A23}
.lg{font-size:10.5px;fill:#3B4948}
.niv{font-size:9.5px;font-weight:700;fill:#9BAAA7;letter-spacing:.12em}
</style>
<defs>
<marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0 1 L9 5 L0 9 Z" fill="#465754"/>
</marker>
</defs>

<!-- niveles -->
<text class="niv" x="14" y="72">N0</text>
<text class="niv" x="14" y="252">N1</text>
<text class="niv" x="14" y="336">N2</text>

<!-- login -->
<rect class="caja" x="630" y="46" width="200" height="42" rx="4"/>
<text class="nom" x="730" y="66" text-anchor="middle">Iniciar sesión</text>
<text class="ruta" x="730" y="80" text-anchor="middle">/login · única vista pública</text>

<line class="arista" x1="730" y1="88" x2="730" y2="122" marker-end="url(#fl)"/>
<text class="etq" x="742" y="110">sesión válida</text>

<!-- inicio -->
<rect class="raiz" x="600" y="128" width="260" height="48" rx="4"/>
<text class="tit" x="730" y="150" text-anchor="middle">INICIO · tablero de control</text>
<text class="ruta" x="730" y="166" text-anchor="middle">GET /</text>

<!-- bus -->
<line class="arista" x1="730" y1="176" x2="730" y2="206"/>
<line class="arista" x1="160" y1="206" x2="1260" y2="206"/>
<line class="arista" x1="160" y1="206" x2="160" y2="228"/>
<line class="arista" x1="435" y1="206" x2="435" y2="228"/>
<line class="arista" x1="710" y1="206" x2="710" y2="228"/>
<line class="arista" x1="985" y1="206" x2="985" y2="228"/>
<line class="arista" x1="1260" y1="206" x2="1260" y2="228"/>

<!-- ── PLATAFORMA ─────────────────────────────────────── -->
<rect class="grupo-adm" x="40" y="228" width="240" height="44" rx="4"/>
<text class="tit-adm" x="160" y="248" text-anchor="middle">PLATAFORMA</text>
<text class="ruta" x="160" y="263" text-anchor="middle">solo ADMIN · SUPERVISOR · JEFE_TIENDA</text>
