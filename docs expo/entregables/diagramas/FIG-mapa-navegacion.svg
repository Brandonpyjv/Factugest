<text class="ruta" x="367" y="386">/invoice/new</text>
<rect class="caja" x="355" y="405" width="200" height="40" rx="3"/>
<text class="nom" x="367" y="422">Clientes</text>
<text class="ruta" x="367" y="436">/customer</text>
<rect class="caja" x="355" y="455" width="200" height="40" rx="3"/>
