<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discount Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>
                        {% if discount and discount.get('cod_descuento') %}
                            Edit Discount
                        {% else %}
                            New Discount
                        {% endif %}
                    </h4>
                </div>
                <div class="card-body">
                    <form 
                      action="{% if discount and discount.get('cod_descuento') %}
                                  {{ url_for('edit_discount', id=discount.cod_descuento) }}
                              {% else %}
                                  {{ url_for('new_discount') }}
                              {% endif %}"
                      method="post">

                        <div class="mb-3">
                            <label class="form-label">Description *</label>
                            <input type="text" name="descripcion" class="form-control" required
                                   value="{{ discount.descripcion if discount else '' }}"
                                   placeholder="e.g. Volume discount, Special promotion">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Discount Percentage *</label>
                            <div class="input-group">
                                <input type="number" name="porcentaje" class="form-control" required
                                       min="0" max="100" step="0.01" placeholder="0.00"
                                       value="{{ discount.porcentaje if discount else '' }}">
                                <span class="input-group-text">%</span>
                            </div>
                            <div class="form-text">Discount percentage (0-100%)</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Discount Application</label>
                            <div class="card">
                                <div class="card-body">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox"
                                               name="aplica_a_producto" value="1" id="aplicaProducto"
                                               {% if discount and discount.aplica_a_producto == 1 %}checked{% endif %}>
                                        <label class="form-check-label" for="aplicaProducto">
                                            Applies to Pending Invoice
                                        </label>
                                    </div>
                                    <div class="form-check mt-2">
                                        <input class="form-check-input" type="checkbox"
                                               name="aplica_a_factura" value="1" id="aplicaFactura"
                                               {% if discount and discount.aplica_a_factura == 1 %}checked{% endif %}>
                                        <label class="form-check-label" for="aplicaFactura">
                                            Applies to Full Invoice
                                        </label>
                                    </div>
                                    <small class="text-muted">You can select both options</small>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-warning">
                                <i class="fas fa-save"></i> Save
                            </button>
                            <a href="{{ url_for('discount') }}" class="btn btn-secondary">
                                Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
