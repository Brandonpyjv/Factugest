<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Branch Form | Factugest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h1>
            <i class="fas fa-map-marker-alt"></i>
            {{ 'Edit Branch' if branch and branch.cod_sucursal else 'New Branch' }}
        </h1>

        <hr>

        <form action="#" method="POST">

            {% if branch %}
                <input type="hidden" name="cod_sucursal" value="{{ branch.cod_sucursal }}">
            {% endif %}

            <div class="mb-3">
                <label class="form-label">Branch Code *</label>
                <input type="number" name="cod_sucursal" class="form-control" required
                       value="{{ branch.cod_sucursal if branch else '' }}"
                       {{ 'readonly' if branch else '' }}>
                <small class="text-muted">Unique identifier for the branch.</small>
            </div>

            <div class="mb-3">
                <label class="form-label">Branch Name *</label>
                <input type="text" name="nombre" class="form-control" required
                       value="{{ branch.nombre if branch else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Company Tax ID (NIT) / Code *</label>
                <input type="text" name="cod_empresa" class="form-control" required
                       value="{{ branch.cod_empresa if branch else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" name="direccion" class="form-control"
                       value="{{ branch.direccion if branch else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="telefono" class="form-control"
                       value="{{ branch.telefono if branch else '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="correo" class="form-control"
                       value="{{ branch.correo if branch else '' }}">
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Save
                </button>
                <a href="/branches" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>

</body>
</html>
