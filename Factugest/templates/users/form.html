<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	
<body class="container mt-4">
    <h1 class="mb-4" th:text="${usuario.cod_usuario} == 0 ? 'Nuevo Usuario' : 'Editar Usuario'"></h1>

    <form th:action="@{/usuarios/guardar}" method="post" th:object="${usuario}">
        <input type="hidden" th:field="*{cod_usuario}">

        <div class="mb-3">
            <label class="form-label">Nombre:</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Correo:</label>
            <input type="email" class="form-control" th:field="*{correo}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña:</label>
            <input type="password" class="form-control" th:field="*{contrasena}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Rol:</label>
            <input type="text" class="form-control" th:field="*{rol}" placeholder="Admin, Cliente, etc.">
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('users')}}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
