<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Impuesto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 th:text="${item.codImpuesto != null} ? 'Editar Impuesto' : 'Nuevo Impuesto'">Nuevo Impuesto</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/impuestos/guardar}" th:object="${item}" method="post">
                        <input type="hidden" th:field="*{codImpuesto}">

                        <div class="mb-3">
                            <label class="form-label">Descripción *</label>
                            <input type="text" th:field="*{descripcion}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Porcentaje *</label>
                            <div class="input-group">
                                <input type="number" th:field="*{porcentaje}" class="form-control" required min="0" max="100" step="0.01">
                                <span class="input-group-text">%</span>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-warning">
                                <i class="fas fa-save"></i>
                                <span th:text="${item.codImpuesto != null} ? 'Actualizar' : 'Guardar'">Guardar</span>
                            </button>
                            <a href="{{ url_for ('taxes.invoice_taxes')}}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
