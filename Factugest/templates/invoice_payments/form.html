<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pagoFactura.cod_pago_factura != null ? 'Editar Pago' : 'Nuevo Pago'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
			
<div class="container mt-5">
    <h2 class="mb-4 text-center" th:text="${pagoFactura.cod_pago_factura != null ? 'Editar Pago' : 'Nuevo Pago'}"></h2>

    <form th:action="@{/pagos_factura/guardar}" th:object="${pagoFactura}" method="post" class="border p-4 rounded bg-light shadow-sm">
        <div class="mb-3">
            <label class="form-label">Código Factura</label>
            <input type="number" th:field="*{cod_factura}" class="form-control" placeholder="Ej: 1001">
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="datetime-local" th:field="*{fecha}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Monto</label>
            <input type="number" step="0.01" th:field="*{monto}" class="form-control" placeholder="Ej: 2500.00" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Código Método de Pago</label>
            <input type="number" th:field="*{cod_metodo_pago}" class="form-control" placeholder="Ej: 1">
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Guardar
            </button>
            <a href="/invoice_payments" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Cancelar
            </a>
        </div>
    </form>
</div>

<script src="https://kit.fontawesome.com/a2d04a4f8b.js" crossorigin="anonymous"></script>
</body>
</html>
